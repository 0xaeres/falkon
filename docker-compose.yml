name: falkon

# One image for every Falkon service. Only backend builds it; the others start after backend, so parallel
# builds cannot race to export the same tag. pull_policy never: the tag exists only locally, so compose must
# not try to pull it before backend has built it.
x-image: &app
  image: falkon-app
  pull_policy: never

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: falkon, POSTGRES_PASSWORD: falkon, POSTGRES_DB: falkon }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U falkon"], interval: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  backend:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile }
    command: sh -c "pnpm --filter @falkon/db push && pnpm --filter @falkon/backend start"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://falkon:falkon@postgres:5432/falkon
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
    volumes: [data:/data, "./config.json:/config/config.json:ro"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  zoekt:
    <<: *app
    command: zoekt-webserver -index /data/index -rpc -listen :6070
    volumes: [data:/data]
    # Not published to the host: zoekt has no auth, so it must only be reachable by the api inside the compose network.
    expose: ["6070"]
    depends_on: [backend]

  # NestJS service: serves /mcp/<product> and the Product
  # registry admin API on a second listener (3002). Both are published on host loopback only; the 0.0.0.0
  # binds are inside the container. The admin listener always runs and needs `Authorization: Bearer <token>`: ADMIN_TOKEN
  # (32+ characters) if set, else the token generated into /data/secrets/admin.token (`scripts/admin-token.sh show|reset`).
  # AUTH_MODE=apiKey needs ACCESS_FILE pointing at a mounted access file, or it denies everyone.
  api:
    <<: *app
    # The esbuild bundle under plain node: tsx would add ~90 MB of loader and esbuild service.
    command: node packages/api/dist/main.js
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://falkon:falkon@postgres:5432/falkon
      DATA_DIR: /data
      ZOEKT_URL: http://zoekt:6070
      CONFIG_PATH: /config/config.json
      API_HOST: 0.0.0.0
      API_ADMIN_HOST: 0.0.0.0
      AUTH_MODE: ${AUTH_MODE:-none}
      FALKON_UI_URL: ${FALKON_UI_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Host names (no port) the listeners answer besides loopback: `api` is how the ui container reaches the admin listener.
      API_ALLOWED_HOSTS: api
      # Credential encryption key (README "Stored credentials"); both empty = generated into /data/secrets/master.key.
      FALKON_SECRET_KEY: ${FALKON_SECRET_KEY:-}
      FALKON_SECRET_KEY_FILE: ${FALKON_SECRET_KEY_FILE:-}
    volumes: [data:/data, "./config.json:/config/config.json:ro"]
    ports: ["127.0.0.1:3001:3001", "127.0.0.1:3002:3002"]
    depends_on: [backend, zoekt]

  # Falkon UI (Next standalone). Connections and repository search go to the engine's admin listener; the other
  # routes stay on the mock until later slices. The admin token is read per request from the api's /data/secrets/admin.token
  # (the data volume, read-only); ENGINE_ADMIN_TOKEN, when set, overrides it. Kept in the server process and never sent to
  # the browser. Published on host loopback only.
  ui:
    <<: *app
    command: node packages/ui/.next/standalone/packages/ui/server.js
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ENGINE_URL: http://api:3002
      DATA_DIR: /data
      ENGINE_ADMIN_TOKEN: ${ENGINE_ADMIN_TOKEN:-}
      # The Connect page shows these; AUTH_MODE must match the api service.
      FALKON_MCP_URL: ${FALKON_MCP_URL:-}
      AUTH_MODE: ${AUTH_MODE:-none}
    volumes: [data:/data:ro]
    depends_on: [api]
    ports: ["127.0.0.1:3100:3000"]

volumes:
  pgdata:
  data:
