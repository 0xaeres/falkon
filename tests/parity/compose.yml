# Differential parity stack: real Sourcebot v6 (oracle) and this clone, indexing the same
# read-only corpus. Oracle UI/API on :3100, clone on :3200.
#   ./tests/parity/up.sh        # fetch corpus, generate configs, start, seed the v6 API key
#   node tests/parity/run.mjs   # replay tests/parity/queries.json against both, write tests/parity/reports/
name: sbc-parity

x-v6-env: &v6env
  DATABASE_URL: postgresql://sb:sb@v6-postgres:5432/sb
  REDIS_URL: redis://v6-redis:6379
  CONFIG_PATH: /config/config.json
  SOURCEBOT_ENCRYPTION_KEY: ${PARITY_ENCRYPTION_KEY:-parity-encryption-key-32-bytes!!}
  AUTH_SECRET: ${PARITY_AUTH_SECRET:-parity-auth-secret-not-for-production}
  AUTH_URL: http://localhost:3100
  SOURCEBOT_EE_LICENSE_KEY: ${SOURCEBOT_EE_LICENSE_KEY:-}
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

services:
  v6-postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: sb, POSTGRES_PASSWORD: sb, POSTGRES_DB: sb }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sb"], interval: 3s, retries: 30 }
  v6-redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 30 }
  v6:
    image: ${V6_IMAGE:-docker.sourcebot.dev/sourcebot-dev/sourcebot:v6.0.1}
    environment: *v6env
    env_file: [{ path: .env, required: false }]
    volumes:
      - v6data:/data
      - ./.corpus:/corpus:ro
      - ./.gen/v6.config.json:/config/config.json:ro
    # 16070: v6's zoekt, loopback only, for the engine-level differential (engine.mjs). Zoekt has no auth.
    ports: ["3100:3000", "127.0.0.1:16070:6070"]
    depends_on: { v6-postgres: { condition: service_healthy }, v6-redis: { condition: service_healthy } }

  sbc-postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: sbc, POSTGRES_PASSWORD: sbc, POSTGRES_DB: sbc }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sbc"], interval: 3s, retries: 30 }
  sbc-redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 30 }
  sbc-backend: &sbc
    image: sourcebot-clone-app
    build: { context: ../.., dockerfile: docker/Dockerfile }
    command: sh -c "pnpm --filter @sbc/db push && pnpm --filter @sbc/backend start"
    environment: &sbcenv
      DATABASE_URL: postgresql://sbc:sbc@sbc-postgres:5432/sbc
      REDIS_URL: redis://sbc-redis:6379
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
      ZOEKT_URL: http://sbc-zoekt:6070
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    env_file: [{ path: .env, required: false }]
    volumes:
      - sbcdata:/data
      - ./.corpus:/corpus:ro
      - ./.gen/clone.config.json:/config/config.json:ro
    depends_on: { sbc-postgres: { condition: service_healthy }, sbc-redis: { condition: service_healthy } }
  sbc-zoekt:
    <<: *sbc
    command: zoekt-webserver -index /data/index -rpc -listen :6070
    ports: ["127.0.0.1:16071:6070"]
    depends_on: [sbc-backend]
  sbc-web:
    <<: *sbc
    command: pnpm --filter @sbc/web start
    ports: ["3200:3000"]
    depends_on: [sbc-backend, sbc-zoekt]

volumes:
  v6data:
  sbcdata:
