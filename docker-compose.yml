services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: sbc, POSTGRES_PASSWORD: sbc, POSTGRES_DB: sbc }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sbc"], interval: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  app-base: &app
    image: sourcebot-clone-app
    build: { context: ., dockerfile: docker/Dockerfile }
    profiles: [build-only]

  backend:
    <<: *app
    profiles: []
    command: sh -c "pnpm --filter @sbc/db push && pnpm --filter @sbc/backend start"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://sbc:sbc@postgres:5432/sbc
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
    volumes: [data:/data, "./config.json:/config/config.json:ro"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  zoekt:
    <<: *app
    profiles: []
    command: zoekt-webserver -index /data/index -rpc -listen :6070
    volumes: [data:/data]
    # Not published to the host: zoekt has no auth, so it must only be reachable by web inside the compose network.
    expose: ["6070"]
    depends_on: [backend]

  web:
    <<: *app
    profiles: []
    command: pnpm --filter @sbc/web start
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://sbc:sbc@postgres:5432/sbc
      DATA_DIR: /data
      ZOEKT_URL: http://zoekt:6070
      CONFIG_PATH: /config/config.json
    volumes: [data:/data, "./config.json:/config/config.json:ro"]
    ports: ["3000:3000"]
    depends_on: [backend, zoekt]

  # NestJS boundary (strangler): serves /mcp/<product> beside web's untouched /api/mcp, and the Product
  # registry admin API on a second listener (3002). Both are published on host loopback only; the 0.0.0.0
  # binds are inside the container. The admin listener only runs when ADMIN_TOKEN (32+ characters) is set and
  # then needs `Authorization: Bearer <token>`; unset, nothing listens on 3002 and the published port is unused.
  # AUTH_MODE=apiKey needs ACCESS_FILE pointing at a mounted access file, or it denies everyone.
  api:
    <<: *app
    profiles: []
    # The esbuild bundle under plain node: tsx would add ~90 MB of loader and esbuild service.
    command: node packages/api/dist/main.js
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://sbc:sbc@postgres:5432/sbc
      DATA_DIR: /data
      ZOEKT_URL: http://zoekt:6070
      CONFIG_PATH: /config/config.json
      API_HOST: 0.0.0.0
      API_ADMIN_HOST: 0.0.0.0
      AUTH_MODE: ${AUTH_MODE:-none}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Host names (no port) the listeners answer besides loopback: `api` is how the ui container reaches the admin listener.
      API_ALLOWED_HOSTS: api
      # Credential encryption key (README "Stored credentials"); both empty = generated into /data/secrets/master.key.
      FALKON_SECRET_KEY: ${FALKON_SECRET_KEY:-}
      FALKON_SECRET_KEY_FILE: ${FALKON_SECRET_KEY_FILE:-}
    volumes: [data:/data, "./config.json:/config/config.json:ro"]
    ports: ["127.0.0.1:3001:3001", "127.0.0.1:3002:3002"]
    depends_on: [backend, zoekt]

  # Falkon UI (Next standalone). Connections and repository search go to the engine's admin listener; the other
  # routes stay on the mock until later slices. ENGINE_ADMIN_TOKEN is the api's ADMIN_TOKEN (set it in .env), kept in
  # the server process and never sent to the browser. Published on host loopback only.
  ui:
    <<: *app
    profiles: []
    command: node packages/ui/.next/standalone/packages/ui/server.js
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ENGINE_URL: http://api:3002
      ENGINE_ADMIN_TOKEN: ${ENGINE_ADMIN_TOKEN:-}
    depends_on: [api]
    ports: ["127.0.0.1:3100:3000"]

volumes:
  pgdata:
  data:
